<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1020">
<title>Deon's Games</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0c1020;
    --card: #171d33;
    --card-press: #243056;
    --text: #f4f6fb;
    --muted: #b7c0d4;
    --accent: #7eb6ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(120% 80% at 50% -10%, #1a2450 0%, var(--bg) 55%);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
  }
  main {
    width: min(440px, 100%);
    padding-top: 8vh;
  }
  h1 {
    margin: 0 0 8px;
    font-size: clamp(2rem, 8vw, 2.6rem);
    letter-spacing: -0.03em;
    line-height: 1.1;
  }
  p {
    margin: 0 0 28px;
    color: var(--muted);
    font-size: 1.05rem;
  }
  nav { display: flex; flex-direction: column; gap: 14px; }
  a {
    display: flex;
    align-items: center;
    min-height: 72px;
    padding: 18px 20px;
    border-radius: 16px;
    background: var(--card);
    color: var(--text);
    text-decoration: none;
    font-size: 1.35rem;
    font-weight: 700;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
  }
  a span {
    margin-left: auto;
    color: var(--accent);
    font-weight: 600;
    font-size: 1.5rem;
  }
  a:hover, a:focus-visible { background: var(--card-press); outline: none; }
  a:active { transform: translateY(1px); }
</style>
</head>
<body>
<main>
  <h1>Deon's Games</h1>
  <p>Tap a game to play in the browser.</p>
  <nav>
    <a href="faceballs/">Faceballs <span aria-hidden="true">›</span></a>
    <a href="star-fleet-command/">Star Fleet Command <span aria-hidden="true">›</span></a>
    <a href="flightsim/">Raptor Flight Sim <span aria-hidden="true">›</span></a>
  </nav>
</main>
</body>
</html>
